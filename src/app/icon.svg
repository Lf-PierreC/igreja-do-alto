<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="mountain-mask">
      <!-- Fundo preto (tudo que fica transparente por padrão) -->
      <rect width="100" height="100" fill="black" />
      <!-- Círculo externo branco (revela o anel externo e base) -->
      <circle cx="50" cy="50" r="48" fill="white" />
      <!-- Círculo interno preto (vão/céu transparente) -->
      <circle cx="50" cy="50" r="42" fill="black" />
      <!-- Silhueta das montanhas em branco (revela o formato da montanha) -->
      <path
        d="M6 56 L29 29 L63 69 L58 69 L35 41 L51 22 L73 49 L82 38 L94 54 A43 43 0 0 1 6 56 Z"
        fill="white"
      />
      <path
        d="M7 55 L29 30 L59 66 L64 66 L36 33 L51 17 L73 44 L82 34 L93 50 A42.5 42.5 0 1 1 7 55 Z"
        fill="white"
      />
      <!-- Fenda diagonal em preto (vão da montanha 100% transparente) -->
      <path
        d="M28 29 L60 67 L64.5 67 L32.5 29 Z"
        fill="black"
      />
    </mask>
  </defs>

  <!-- Preenchimento integral na cor oficial (#CB4B3B) recortado com transparência -->
  <rect width="100" height="100" fill="#CB4B3B" mask="url(#mountain-mask)" />
</svg>
